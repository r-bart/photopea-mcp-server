<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photopea MCP Bridge</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }

    /* -------------------------------------------------------------------------
       Layout: column flex — status bar / iframe / log panel
    ------------------------------------------------------------------------- */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* -------------------------------------------------------------------------
       Status bar
    ------------------------------------------------------------------------- */
    #status-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      height: 36px;
      background: #2d2d2d;
      border-bottom: 1px solid #3a3a3a;
      user-select: none;
    }

    #github-star {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: #333;
      border: 1px solid #555;
      border-radius: 6px;
      color: #ccc;
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    #github-star:hover {
      background: #444;
      border-color: #777;
      color: #fff;
    }
    #github-star svg {
      fill: #ccc;
    }
    #github-star:hover svg {
      fill: #f0c14b;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e74c3c;
      flex-shrink: 0;
      transition: background 0.25s ease;
    }

    #status-dot.connected {
      background: #2ecc71;
    }

    #status-text {
      color: #aaa;
      font-size: 12px;
      min-width: 100px;
    }

    #doc-info {
      margin-left: auto;
      color: #777;
      font-size: 11px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    /* -------------------------------------------------------------------------
       Photopea iframe
    ------------------------------------------------------------------------- */
    #photopea-wrap {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
    }

    #photopea {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* -------------------------------------------------------------------------
       Activity log panel
    ------------------------------------------------------------------------- */
    #log-panel {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      background: #252525;
      border-top: 1px solid #3a3a3a;
      max-height: 30vh;
      transition: max-height 0.2s ease;
    }

    #log-panel.collapsed {
      max-height: 28px;
    }

    #log-header {
      flex: 0 0 28px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      cursor: pointer;
      background: #2d2d2d;
      border-bottom: 1px solid #3a3a3a;
      user-select: none;
      gap: 8px;
    }

    #log-header:hover {
      background: #333;
    }

    #log-title {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    #log-count {
      font-size: 11px;
      color: #666;
      margin-left: auto;
    }

    #log-chevron {
      font-size: 10px;
      color: #666;
      transition: transform 0.2s ease;
    }

    #log-panel.collapsed #log-chevron {
      transform: rotate(180deg);
    }

    #log-entries {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 4px 0;
    }

    #log-entries::-webkit-scrollbar {
      width: 6px;
    }

    #log-entries::-webkit-scrollbar-track {
      background: #1e1e1e;
    }

    #log-entries::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 3px;
    }

    .log-entry {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 3px 12px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      line-height: 1.5;
      border-left: 2px solid transparent;
    }

    .log-entry:hover {
      background: #2a2a2a;
    }

    .log-entry.entry-ok {
      border-left-color: #2ecc71;
    }

    .log-entry.entry-err {
      border-left-color: #e74c3c;
    }

    .log-ts {
      color: #555;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .log-tool {
      color: #569cd6;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .log-summary {
      color: #d4d4d4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #log-empty {
      padding: 8px 12px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      color: #555;
    }
  </style>
</head>
<body>
  <div id="app">

    <!-- Status bar -->
    <div id="status-bar">
      <div id="status-dot"></div>
      <span id="status-text">Connecting...</span>
      <span id="doc-info"></span>
      <a id="github-star" href="https://github.com/attalla1/photopea-mcp-server" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25z"/></svg>
        Star on GitHub
      </a>
    </div>

    <!-- Photopea iframe -->
    <div id="photopea-wrap">
      <iframe
        id="photopea"
        src="https://www.photopea.com#%7B%7D"
      ></iframe>
    </div>

    <!-- Activity log -->
    <div id="log-panel">
      <div id="log-header">
        <span id="log-title">Activity Log</span>
        <span id="log-count">0 entries</span>
        <span id="log-chevron">&#9650;</span>
      </div>
      <div id="log-entries">
        <div id="log-empty">No activity yet.</div>
      </div>
    </div>

  </div>

  <script src="/client.js"></script>
</body>
</html>
